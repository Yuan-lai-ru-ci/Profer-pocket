name: Pocket Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the GitHub Release after all validations pass
        required: true
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Read release version
        run: |
          RELEASE_VERSION=$(node -p "require('./pocket-app/release.config.json').versionName")
          test -n "$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build web bundle
        run: bun run build
      - name: Require production signing secrets
        env:
          POCKET_RELEASE_KEYSTORE_BASE64: ${{ secrets.POCKET_RELEASE_KEYSTORE_BASE64 }}
          POCKET_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_RELEASE_STORE_PASSWORD }}
          POCKET_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_RELEASE_KEY_ALIAS }}
          POCKET_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$POCKET_RELEASE_KEYSTORE_BASE64"
          test -n "$POCKET_RELEASE_STORE_PASSWORD"
          test -n "$POCKET_RELEASE_KEY_ALIAS"
          test -n "$POCKET_RELEASE_KEY_PASSWORD"
          printf '%s' "$POCKET_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/profer-pocket-release.jks"
          test -s "$RUNNER_TEMP/profer-pocket-release.jks"
      - name: Install Pocket dependencies
        run: npm ci --prefix pocket-app
      - name: Build signed release APK
        env:
          POCKET_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/profer-pocket-release.jks
          POCKET_RELEASE_STORE_PASSWORD: ${{ secrets.POCKET_RELEASE_STORE_PASSWORD }}
          POCKET_RELEASE_KEY_ALIAS: ${{ secrets.POCKET_RELEASE_KEY_ALIAS }}
          POCKET_RELEASE_KEY_PASSWORD: ${{ secrets.POCKET_RELEASE_KEY_PASSWORD }}
        run: node pocket-app/scripts/build-apk.mjs --variant=release
      - name: Prepare and validate manifest
        run: node pocket-app/scripts/prepare-github-release.mjs --apk "pocket-app/releases/Profer-Pocket-${RELEASE_VERSION}.apk" --manifest pocket-app/releases/pocket-update.json --dry-run
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-release-${{ env.RELEASE_VERSION }}
          path: |
            pocket-app/releases/Profer-Pocket-${{ env.RELEASE_VERSION }}.apk
            pocket-app/releases/pocket-update.json
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.publish == true }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pocket-app/release.config.json
            pocket-app/package.json
            package.json
            pocket-app/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read release version
        run: |
          RELEASE_VERSION=$(node -p "require('./pocket-app/release.config.json').versionName")
          test -n "$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: pocket-release-${{ env.RELEASE_VERSION }}
          path: pocket-app/releases
      - name: Prepare fresh publish manifest
        run: rm pocket-app/releases/pocket-update.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node pocket-app/scripts/prepare-github-release.mjs --apk "pocket-app/releases/Profer-Pocket-${RELEASE_VERSION}.apk" --manifest pocket-app/releases/pocket-update.json --tag "v${RELEASE_VERSION}" --publish
